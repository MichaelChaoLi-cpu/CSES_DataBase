[project]
name = "cses-database"
version = "0.1.0"
description = "Reproducible CSES alignment and database infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["rsc/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
